<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goalie Coverage</title>
</head>
<body>
  <div id="view">
    <nav id="viewbar" aria-label="Views"></nav>
    <div id="puckTag">Puck</div>
    <div id="youArePuck">Puck's view: looking over the Puck at the net</div>
    <div id="flash" role="status"></div>
    <div id="noShot" role="status">The Puck is on or behind the goal line: there is no shot.</div>
    <section id="coverageCard" aria-label="Coverage"></section>
    <section id="goalieCard" class="card" aria-label="Goalie"></section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
